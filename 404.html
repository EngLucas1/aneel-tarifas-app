<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página Não Encontrada | ANEEL Tarifas A4</title>
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2338bdf8'><polygon points='13 2 3 14 12 14 11 22 21 10 12 10 13 2'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .not-found-container {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }

    .not-found-card {
      max-width: 540px;
      padding: 48px 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .error-code {
      font-size: 5rem;
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-family: var(--font-mono);
    }

    .not-found-card h2 {
      font-size: 1.5rem;
      font-weight: 700;
    }

    .not-found-card p {
      color: var(--text-secondary);
      font-size: 0.95rem;
      line-height: 1.6;
    }

    .countdown-text {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 8px;
    }
  </style>
</head>

<body class="dark-theme">
  <header class="app-header">
    <div class="header-container">
      <div class="brand">
        <div class="brand-logo">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
          </svg>
        </div>
        <div class="brand-info">
          <h1>ANEEL Tarifas A4</h1>
          <p class="brand-subtitle">Gestor Tarifário A4 Verde e Azul</p>
        </div>
      </div>
    </div>
  </header>

  <main class="not-found-container">
    <div class="glass-card not-found-card">
      <div class="error-code">404</div>
      <h2>Página Não Encontrada</h2>
      <p>
        O link acessado não existe ou foi movido. Você pode retornar imediatamente à página principal da aplicação.
      </p>
      <a href="./index.html" class="btn btn-primary" id="btn-return-home">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        Voltar à Página Principal
      </a>
      <span class="countdown-text" id="countdown">Redirecionando em 5 segundos...</span>
    </div>
  </main>

  <script>
    let seconds = 5;
    const countdownEl = document.getElementById('countdown');
    const timer = setInterval(() => {
      seconds--;
      if (seconds <= 0) {
        clearInterval(timer);
        window.location.href = './index.html';
      } else {
        countdownEl.textContent = `Redirecionando em ${seconds} segundo${seconds > 1 ? 's' : ''}...`;
      }
    }, 1000);
  </script>
</body>

</html>
